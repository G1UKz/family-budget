[project]
name = "family-budget"
version = "0.1.0"
description = "Family budget service with rule-based + AI-assisted categorization"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pdfplumber>=0.11",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "itsdangerous>=2.2",
  "anthropic>=0.70",
  "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "reportlab>=4.2", "mypy>=1.11"]

[project.scripts]
budget = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
