# cp inventory.example.ini inventory.ini (git-ignored). Add more hosts to [k3s_agents] to grow the cluster.
[k3s_server]
budget-1 ansible_host=203.0.113.10

[k3s_agents]

[all:vars]
ansible_user=root              ; first run only; afterwards admin_user with sudo
admin_user=ivan
; swap_size=2G            ; swap file size, "0" to skip
admin_pubkey_file=~/.ssh/id_ed25519.pub
admin_cidrs=["0.0.0.0/0"]      ; restrict to your IPs if they are static (SSH + kube API)
ssh_port=22
k3s_version=v1.36.6+k3s1
argocd_chart_version=10.14.0
