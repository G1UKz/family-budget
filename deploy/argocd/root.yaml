# App of apps: kubectl apply -n argocd -f deploy/argocd/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  source: {repoURL: https://github.com/G1UKz/family-budget.git, targetRevision: main, path: deploy/argocd/apps}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
