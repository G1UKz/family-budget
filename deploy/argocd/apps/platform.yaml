apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  project: default
  destination: {server: https://kubernetes.default.svc}
  source: {repoURL: https://github.com/G1UKz/family-budget.git, targetRevision: main, path: deploy/platform}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 30s, maxDuration: 5m}}
