apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: {server: https://kubernetes.default.svc, namespace: vault}
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.1
    helm:
      valuesObject:
        injector: {enabled: false}
        ui: {enabled: false}
        server:
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
          dataStorage: {enabled: true, size: 2Gi, storageClass: local-path}
          standalone: {enabled: false}
          ha:
            enabled: true
            replicas: 1        # raft; grow to 3 together with the node count
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = false
                listener "tcp" {
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_disable = 1   # in-cluster only (ClusterIP); no ingress for Vault
                }
                storage "raft" {
                  path = "/vault/data"
                }
                service_registration "kubernetes" {}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
