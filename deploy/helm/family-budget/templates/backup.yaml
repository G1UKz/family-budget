{{- if .Values.backup.enabled }}
{{- $pod := dict "Values" .Values "Release" .Release -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "fb.name" . }}-backup
  labels: {{- include "fb.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec: {{- include "fb.backupPod" (merge (dict "mode" "backup") $pod) | nindent 10 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "fb.name" . }}-restore-check
  labels: {{- include "fb.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.restoreCheckSchedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec: {{- include "fb.backupPod" (merge (dict "mode" "restore-check") $pod) | nindent 10 }}
{{- end }}
