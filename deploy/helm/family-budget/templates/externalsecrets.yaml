{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels: {{- include "fb.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.externalSecrets.storeName }}}
  target: {name: {{ .Values.secretName }}}
  data:
    - secretKey: BUDGET_SECRET_KEY
      remoteRef: {key: {{ .Values.externalSecrets.appPath }}, property: secret_key}
    - secretKey: BUDGET_ANTHROPIC_API_KEY
      remoteRef: {key: {{ .Values.externalSecrets.appPath }}, property: anthropic_api_key}
    - secretKey: BUDGET_HOME_CITY_REGEX
      remoteRef: {key: {{ .Values.externalSecrets.appPath }}, property: home_city_regex}
{{- if .Values.backup.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.backup.secretName }}
  labels: {{- include "fb.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.externalSecrets.storeName }}}
  target: {name: {{ .Values.backup.secretName }}}
  data:
    - {secretKey: RESTIC_REPOSITORY, remoteRef: {key: {{ .Values.externalSecrets.backupPath }}, property: restic_repository}}
    - {secretKey: RESTIC_PASSWORD, remoteRef: {key: {{ .Values.externalSecrets.backupPath }}, property: restic_password}}
    - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: {{ .Values.externalSecrets.backupPath }}, property: aws_access_key_id}}
    - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: {{ .Values.externalSecrets.backupPath }}, property: aws_secret_access_key}}
{{- end }}
{{- end }}
