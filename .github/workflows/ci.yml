name: ci
on:
  push: {branches: [main]}
  pull_request:

permissions: {contents: read}

concurrency: {group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: scripts/check-private-data.sh
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: budget, POSTGRES_PASSWORD: budget, POSTGRES_DB: budget}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U budget" --health-interval 3s --health-retries 20
    defaults: {run: {working-directory: backend}}
    env:
      BUDGET_DATABASE_URL: postgresql+psycopg://budget:budget@localhost:5432/budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres)
        run: pytest -q
        env: {TEST_DATABASE_URL: "postgresql+psycopg://budget:budget@localhost:5432/budget"}
      - name: Migrations apply and match the models
        run: |
          psql postgresql://budget:budget@localhost:5432/budget -c 'drop schema public cascade; create schema public;'
          alembic upgrade head && alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build

  deploy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint + kubeconform
        run: |
          helm lint deploy/helm/family-budget -f deploy/helm/family-budget/values-prod.yaml
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          helm template t deploy/helm/family-budget -f deploy/helm/family-budget/values-prod.yaml \
            | ./kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          ./kubeconform -strict -summary -ignore-missing-schemas -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/argocd deploy/platform
      - name: ansible-lint
        run: |
          pip install ansible-core ansible-lint
          cd deploy/ansible && ansible-galaxy collection install -r requirements.yml && ansible-lint site.yml
      - name: shellcheck
        run: shellcheck deploy/backup/entrypoint.sh deploy/vault/*.sh scripts/*.sh

  images:
    needs: [privacy, backend, frontend, deploy-lint]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs: {tag: "${{ steps.meta.outputs.tag }}"}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ghcr.io/g1ukz/family-budget:${{ steps.meta.outputs.tag }},ghcr.io/g1ukz/family-budget:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Backup image
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/g1ukz/family-budget-backup:${{ steps.meta.outputs.tag }},ghcr.io/g1ukz/family-budget-backup:latest
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/g1ukz/family-budget:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  gitops-bump:
    # GitOps: CI never touches the cluster; it commits the new tag and Argo CD syncs it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG=${{ needs.images.outputs.tag }}
          sed -i -E "s|^(  tag: ).*|\1${TAG}|" deploy/helm/family-budget/values-prod.yaml
          sed -i -E "s|(family-budget-backup:).*|\1${TAG}|" deploy/helm/family-budget/values-prod.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "deploy: family-budget ${TAG} [skip ci]" && git push || echo "nothing to bump"
